<!DOCTYPE html>
<!--
  DirectCrest – 3D INTRO ONLY (airliner laps the Earth once, then flies to China).
  When the animation ends the screen fades to navy and this hook fires:

      window.addEventListener('intro:complete', () => { /* open your homepage */ });
      // or define it before this script runs:
      window.onIntroComplete = () => { location.href = '/home'; };

  Tweak: FLIGHT (seconds, in the script), the start point ll(14,-30) and heading .45 in simulate(),
  the target C (Shanghai) and the HUD texts in intro().
-->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DirectCrest – 3D Intro</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1628;--ocean:#10294a;--steel:#8a97a6;--frost:#eef3f9;--mist:#9fb0c3;--sand:#eae3d7;--cu:#d9963b;--bd:rgba(238,243,249,.16);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--navy);color:var(--frost);font-family:Inter,system-ui,sans-serif;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
h1,h2,h3,.brand{font-family:"Instrument Serif",Georgia,serif;font-weight:400;margin:0}
#ld{position:fixed;inset:0;z-index:12;background:var(--navy);display:grid;place-items:center;text-align:center;transition:opacity .8s}
#ld i{display:block;width:42px;height:42px;margin:0 auto 18px;border:2px solid var(--bd);border-top-color:var(--cu);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#ov{position:fixed;inset:0;background:var(--navy);z-index:9;opacity:0;pointer-events:none;transition:opacity .9s}
#hud{position:fixed;inset:0;z-index:8;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 22px) 26px 28px;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .8s}
.brand{font-size:28px}.cap{max-width:430px}.cap small{display:block;color:var(--mist);letter-spacing:.16em;font-size:11px}.cap b{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(24px,3.6vw,38px);display:block;margin:8px 0 12px}
.bar{height:2px;background:var(--bd);margin:0 0 10px}.bar i{display:block;height:100%;width:0;background:var(--cu)}
.b{display:inline-block;padding:13px 24px;border-radius:99px;font:600 14px Inter,sans-serif;text-decoration:none;transition:.3s;border:1px solid var(--bd);color:var(--frost);background:none;cursor:pointer}
.b.cu{background:var(--cu);color:#0a1628;border-color:var(--cu)}.b.cu:hover{background:#e8a850}.b.ol:hover{border-color:var(--frost)}
#skip{pointer-events:auto;background:rgba(10,22,40,.5)}
#done{position:fixed;inset:0;z-index:11;display:none;place-items:center;text-align:center;background:var(--navy)}#done.on{display:grid}#done p{color:var(--mist);margin:12px 0 24px}
</style></head><body>
<canvas id="cv"></canvas>
<div id="ld"><div><i></i><div class="mono" style="letter-spacing:.2em;font-size:12px;color:var(--mist)">PREPARING THE PLANET</div></div></div>
<div id="ov"></div>
<div id="hud"><div class="brand">DirectCrest</div>
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px"><div class="cap"><small class="mono" id="hs"></small><b id="ht">Departing for the horizon</b><div class="bar"><i id="hb"></i></div><small class="mono" id="hp"></small></div><button class="b ol" id="skip">Skip intro</button></div></div>

<div id="done"><div><div class="mono" style="letter-spacing:.2em;font-size:12px;color:var(--cu)">INTRO COMPLETE</div><p>Your homepage loads here.</p><button class="b cu" onclick="location.reload()">Replay intro</button></div></div>

<script>
window.onIntroComplete = () => { 
  const returnTo = sessionStorage.getItem('introReturnTo') || '/';
  const url = new URL(returnTo, window.location.origin);
  url.searchParams.set('fromIntro', '1');
  sessionStorage.removeItem('introReturnTo');
  location.href = url.toString(); 
};
</script>

const C=ll(31.23,121.47),FLIGHT=10;let curve,bank=[],lapFrac=.8;
function simulate(){
 let pos=ll(14,-30),la=14*Math.PI/180,lo=-30*Math.PI/180;
 const E=new V3(-Math.sin(lo),0,-Math.cos(lo)),Nn=new V3(-Math.sin(la)*Math.cos(lo),Math.cos(la),Math.sin(la)*Math.sin(lo));
 const fwd=E.multiplyScalar(Math.cos(.45)).addScaledVector(Nn,Math.sin(.45)),ds=.012,pts=[];let trav=0,lapN=0,lap=false,sm=0;
 for(let n=0;n<1700;n++){
  if(trav>=2*Math.PI&&!lap){lap=true;lapN=n}let turn=0;
  if(lap){const d=C.clone().addScaledVector(pos,-pos.dot(C)).normalize(),ang=Math.atan2(pos.dot(new V3().crossVectors(fwd,d)),fwd.dot(d));turn=MU.clamp(ang*.05,-.008,.008);if(pos.angleTo(C)<.03)break}
  fwd.applyAxisAngle(pos,turn);const ax=new V3().crossVectors(pos,fwd).normalize();pos.applyAxisAngle(ax,ds);fwd.applyAxisAngle(ax,ds);trav+=ds;fwd.addScaledVector(pos,-fwd.dot(pos)).normalize();pos.normalize();
  sm=sm*.92+turn*.08;pts.push(pos.clone());bank.push(sm)}
 lapFrac=lapN/pts.length;const N=pts.length;
 curve=new THREE.CatmullRomCurve3(pts.map((p,i)=>{const a=i/N;return p.multiplyScalar(R*(a>.86?mx(1.016,1.0035,ss(.86,1,a)):1.016+.0007*Math.sin(a*60)))}),false,'centripetal');curve.arcLengthDivisions=3000;
 // cloud puffs scattered under the path so you fly past them
 const pc=document.createElement('canvas');pc.width=pc.height=256;const q=pc.getContext('2d');for(let i=0;i<14;i++){const x=70+Math.random()*116,y=96+Math.random()*70,r=34+Math.random()*34,g=q.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');q.fillStyle=g;q.beginPath();q.arc(x,y,r,0,7);q.fill()}
 q.globalCompositeOperation='source-atop';const sg=q.createLinearGradient(0,60,0,200);sg.addColorStop(0,'rgba(255,248,238,0)');sg.addColorStop(1,'rgba(140,160,190,.75)');q.fillStyle=sg;q.fillRect(0,0,256,256);
 const pt=new THREE.CanvasTexture(pc);pt.encoding=THREE.sRGBEncoding;
 for(let i=0;i<190;i++){const f=Math.random(),p=curve.getPointAt(f),t=curve.getTangentAt(f),nn=p.clone().normalize(),lat=new V3().crossVectors(nn,t).normalize().multiplyScalar((Math.random()-.5)*6);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:pt,transparent:true,depthWrite:false,opacity:.78,color:0xfff6ea}));s.position.copy(nn).multiplyScalar(R*(1.004+Math.random()*.008)).add(lat);s.position.setLength(R*(1.004+Math.random()*.008));s.scale.setScalar(1.3+Math.random()*2.2);sc.add(s)}
}
const bankAt=f=>{const x=f*(bank.length-1),i=Math.floor(x);return mx(bank[i],bank[Math.min(i+1,bank.length-1)],x-i)};

/* ---------- state machine: wait -> intro -> fade -> home ---------- */
let phase='wait',tm=0,last=performance.now();
const P=new V3(),Tn=new V3(),N=new V3(),Rv=new V3(),a=new V3(),b=new V3(),look=new V3(),ZERO=new V3(),EST=ll(15,-12,30);
const hs=$('#hs'),ht=$('#ht'),hb=$('#hb'),hp=$('#hp');
function intro(dt){
 if(phase==='intro')tm+=dt;const u=Math.min(1,tm/FLIGHT),f=u*u*(3-2*u);if(u>=1&&phase==='intro')finish();
 curve.getPointAt(f,P);curve.getTangentAt(f,Tn);N.copy(P).normalize();Rv.crossVectors(Tn,N).normalize();
 plane.position.copy(P);plane.up.copy(N);plane.lookAt(a.copy(P).add(Tn));plane.rotateZ(-bankAt(f)*14+Math.sin(T*.8)*.012);plane.updateMatrixWorld(true);
 const on=(T%1.4)<.12;plane.userData.strobe.forEach(m=>m.material.opacity=on?1:0);plane.userData.beacon.material.opacity=(T%1)<.12?1:0;
 if(T-le>.02){le=T;emit()}
 sun.position.copy(P).addScaledVector(N,40).addScaledVector(Tn,28).addScaledVector(Rv,35);
 // camera: wide establishing shot -> chase cam that slowly drifts around the plane -> dive
 const e=MU.smootherstep(tm/4.5,0,1),dist=2.3+.4*Math.sin(T*.19);
 a.copy(P).addScaledVector(Tn,-dist).addScaledVector(N,.75+.25*Math.sin(T*.23)).addScaledVector(Rv,Math.sin(T*.28)*1.5);
 cam.position.lerpVectors(EST,a,e);const dd=ss(.88,1,u);
 if(dd>0){b.copy(P).addScaledVector(N,mx(.8,.5,dd)).addScaledVector(Tn,-mx(dist,.9,dd));cam.position.lerp(b,dd)}
 look.copy(P).addScaledVector(Tn,.6-.4*dd).addScaledVector(N,-.12-.6*dd).lerp(ZERO,1-e);
 cam.up.set(0,1,0).lerp(N,e).normalize();cam.lookAt(look);
 // HUD
 const lap=Math.min(1,f/lapFrac),after=f>lapFrac;hb.style.width=(after?100:lap*100)+'%';
 ht.textContent=f<.03?'Departing for the horizon':!after?'Circling the globe, one full lap':u<.88?'Lap complete. Setting course for China':'Descending into Shanghai';
 hp.textContent=after?'LAP 1 OF 1 · COMPLETE':'LAP 1 OF 1 · '+Math.round(lap*100)+'%';
 hs.textContent='ALT '+(u>.88?Math.round(3000+33000*(1-dd)).toLocaleString():'36,000')+' FT · '+(895+Math.round(Math.sin(T)*8))+' KM/H';
}
function finish(){if(phase!=='intro')return;phase='fade';$('#ov').style.opacity=1;setTimeout(()=>{phase='done';plane.visible=false;trail.visible=false;
 // >>> HOOK: intro finished and the screen is fully navy. Open your homepage here. <<<
 window.dispatchEvent(new CustomEvent('intro:complete'));
 if(typeof window.onIntroComplete==='function')window.onIntroComplete();else $('#done').classList.add('on')},950)}
$('#skip').onclick=()=>{tm=Math.max(tm,FLIGHT*.9)};
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;trU.uT.value=T;
 if(phase==='wait')return;cA.rotation.y+=dt*.003;cB.rotation.y+=dt*.005;
 if(phase==='done')return;intro(dt);ren.render(sc,cam)}

setTimeout(()=>{buildEarth();buildPlane();simulate();built=true;phase='intro';const l=$('#ld');l.style.opacity=0;setTimeout(()=>l.remove(),900)},80);
requestAnimationFrame(frame);
})();
</script></body></html>
